<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>71</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif;touch-action:manipulation;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85))}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}
.scene.on{opacity:1;visibility:visible}
.q{font-size:clamp(18px,4.8vw,24px);line-height:1.45;min-height:3.4em;max-width:520px;margin:0 0 24px}
.stage{font-size:clamp(26px,8vw,44px);letter-spacing:.4em;padding-left:.4em;font-weight:400}
.scene.on .stage{animation:stg 3.4s var(--e,cubic-bezier(.2,.7,.2,1)) both}
@keyframes stg{from{letter-spacing:1.1em;filter:blur(8px)} to{letter-spacing:.4em;filter:blur(0)}}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
::selection{background:#fff;color:#000}
.fade{opacity:0;transition:opacity 1.6s}.fade.on{opacity:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nx{margin-top:26px;font-size:16px;color:#aaa;letter-spacing:.08em;padding:10px 18px}
.nx:hover{color:#fff}
/* date wheels: 3D tambur, kutu yok, satir araliarinda kucuk cizgiler */
.wheels{display:flex;gap:4px;justify-content:center;height:190px;position:relative;padding:0 10px}
.wheels::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:linear-gradient(#000 0,rgba(0,0,0,.6) 20%,transparent 42%,transparent 58%,rgba(0,0,0,.6) 80%,#000 100%)}
.wh{width:78px;height:190px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:76px 0;overscroll-behavior:contain;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-overflow-scrolling:touch}
.wh.drag{cursor:grabbing}
.wh.m{width:124px}.wh::-webkit-scrollbar{display:none}
.wh div{position:relative;height:38px;line-height:38px;scroll-snap-align:center;scroll-snap-stop:always;font-size:21px;color:#fff}
.wh div::after{content:"";position:absolute;left:50%;bottom:0;width:14px;height:1px;margin-left:-7px;background:#fff;opacity:.28}
/* words */
.words{display:flex;flex-wrap:wrap;gap:16px 26px;justify-content:center;max-width:460px}
.words button{font-size:19px;color:#aaa;animation:fl 6s ease-in-out var(--d) infinite alternate;transition:opacity 1s,color .6s,filter 1s}
.words.pick button{opacity:.08;filter:blur(3px)}.words.pick button.s{opacity:1;color:#fff;filter:none}
@keyframes fl{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
/* keys */
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:min(86vw,360px)}
.keys button{aspect-ratio:1;border:1px solid #2c2c2c;border-radius:4px;color:#555;font-size:22px;opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1s,color .4s,border-color .4s;transition-delay:calc(var(--i)*35ms)}
.fade.on .keys button{opacity:1;transform:none}
.keys button:hover{border-color:#777;color:#bbb}.keys button:active{transform:scale(.9);transition-delay:0s}
.fade:not(.on){pointer-events:none}
.ask{text-align:center}.ask .ch{font-size:64px;margin-bottom:6px}.ask p{font-size:20px;margin:0 0 22px}
.ask button{font-size:18px;color:#aaa;letter-spacing:.08em;padding:10px 26px}.ask button:hover{color:#fff}
.keys.pick button{opacity:.06}.keys.pick button.s{opacity:1;color:#fff}
/* countdown */
.rip{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border:1px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none;z-index:45;animation:rip 1.1s ease-out forwards}@keyframes rip{to{transform:scale(14);opacity:0}}
@keyframes pop{from{transform:scale(.55);filter:blur(8px);opacity:0}to{transform:none;filter:none;opacity:1}}
.ask.on .ch{animation:pop .9s cubic-bezier(.2,.7,.2,1)}
.big{font-size:min(34vw,180px);transition:color 2.5s,transform 8s ease-in;user-select:none}
.big.red{color:#c40000;transform:scale(2.6)}
.hint{position:fixed;bottom:9vh;font-size:13px;color:#888;letter-spacing:.1em}
#bk{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 3.5s;z-index:60;pointer-events:none}#bk.on{opacity:1}
@media(prefers-reduced-motion:reduce){.words button{animation:none}}
</style></head><body>
<canvas id="dust" aria-hidden="true"></canvas>

<section class="scene" id="st"><div class="stage">STAGE 2</div></section>

<section class="scene" id="s1"><p class="q" id="q1"></p>
  <div class="fade" id="f1"><div class="wheels"><div class="wh" id="wd"></div><div class="wh m" id="wm"></div><div class="wh" id="wy"></div></div>
  <button class="nx" id="n1">next</button></div></section>

<section class="scene" id="s2"><p class="q" id="q2"></p>
  <div class="fade" id="f2"><div class="words" id="words"></div></div></section>

<section class="scene" id="s3"><p class="q" id="q3"></p>
  <div class="fade" id="f3"><div class="keys" id="keys"></div></div>
  <div class="ask fade" id="ask" style="display:none"><div class="ch" id="ch"></div><p>are you sure?</p><button id="yes">yes</button><button id="no">no</button></div></section>

<section class="scene" id="s4"><div class="big" id="big">71</div><div class="hint fade" id="hint">tap</div></section>
<div id="bk"></div>

<script>
/* Kalp atisi motoru: step2 ve step3 ortak kullanir. Ses kodla uretilir, dosya yok.
   v3: davul degil, gogus kafesinden gelen boguk kalp sesi. "lub" (S1) ve "dub" (S2) ikiser valf kapanisindan olusur,
   perde dususu yok denecek kadar az, yumusak saldiri, gurultu dokusu ve alcak geciren filtre ile. */
(()=>{
const W=window;let ac,bus,master,nb,timer,run=false,pu,sat,muted=false,mul=1,gm=1,cur='normal',lastBeat=0,moodT=0;
W.HR_MS=()=>1000; W.HEART_AUTO=false;
function init(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   // iOS: sessiz modda da cal
  ac=new (W.AudioContext||W.webkitAudioContext)({latencyHint:'interactive'});
  master=ac.createGain();master.gain.value=1;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=14;comp.ratio.value=4;comp.attack.value=.006;comp.release.value=.2;
  master.connect(comp);comp.connect(ac.destination);
  bus=ac.createGain();bus.gain.value=1;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=560;lp.Q.value=.6;      // gogus kafesi: ust sesleri yutar
  const pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=150;pk.Q.value=.8;pk.gain.value=6;   // govde rezonansi (kucuk hoparlorde duyulan kisim)
  bus.connect(lp);lp.connect(pk);pk.connect(master);
  const L=Math.floor(ac.sampleRate*.45),ir=ac.createBuffer(2,L,ac.sampleRate);          // cok kisa, mat oda
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2)}
  const cv=ac.createConvolver();cv.buffer=ir;const wet=ac.createGain();wet.gain.value=.12;pk.connect(cv);cv.connect(wet);wet.connect(master);
  nb=ac.createBuffer(1,Math.floor(ac.sampleRate*.5),ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  sat=ac.createWaveShaper();const n=1024,cu=new Float32Array(n);                         // hafif isinma: alcak sesin ust harmoniklerini uretir
  for(let i=0;i<n;i++){const x=i*2/(n-1)-1;cu[i]=Math.tanh(x*1.5)/Math.tanh(1.5)}
  sat.curve=cu;sat.oversample='2x';sat.connect(bus);
}
/* tek bir valf kapanisi: yumusak baslayan govde + oktav ustu + bandpass gurultu (kan/doku "fus"u) */
function comp1(at,f,fEnd,dur,att,g,nHz){
  const G=Math.min(1.25,g*5),t=ac.currentTime+at;
  const o=ac.createOscillator(),og=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(fEnd,t+dur);   // perde dususu kucuk: davul gibi olmasin
  og.gain.setValueAtTime(.0001,t);og.gain.linearRampToValueAtTime(G,t+att);og.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(og);og.connect(sat);o.start(t);o.stop(t+dur+.05);
  const o2=ac.createOscillator(),g2=ac.createGain();
  o2.type='sine';o2.frequency.setValueAtTime(f*2,t);o2.frequency.exponentialRampToValueAtTime(fEnd*2,t+dur);
  g2.gain.setValueAtTime(.0001,t);g2.gain.linearRampToValueAtTime(G*.45,t+att*1.2);g2.gain.exponentialRampToValueAtTime(.0001,t+dur*.7);
  o2.connect(g2);g2.connect(sat);o2.start(t);o2.stop(t+dur+.05);
  const s=ac.createBufferSource(),f2=ac.createBiquadFilter(),ng=ac.createGain();
  s.buffer=nb;f2.type='bandpass';f2.frequency.value=nHz;f2.Q.value=1.1;
  ng.gain.setValueAtTime(.0001,t);ng.gain.linearRampToValueAtTime(G*.6,t+att);ng.gain.exponentialRampToValueAtTime(.0001,t+dur*.85);
  s.connect(f2);f2.connect(ng);ng.connect(bus);s.start(t,Math.random()*.2,dur+.05);
}
const S1=(at,g)=>{comp1(at,66,52,.18,.020,g,130);comp1(at+.024,80,58,.14,.016,g*.62,190)};    // "lub": alcak, uzun, iki parca
const S2=(at,g)=>{comp1(at,96,76,.12,.012,g*.78,210);comp1(at+.017,118,88,.09,.010,g*.5,270)};  // "dub": biraz tiz, kisa, iki parca
function pulse(){                                   // her atista ekranin ortasi cok hafif parlar
  if(!pu){pu=document.createElement('div');pu.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:39;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.1),transparent 62%)';document.body.appendChild(pu)}
  if(pu._a)pu._a.cancel();
  pu._a=pu.animate([{opacity:0},{opacity:1,offset:.1},{opacity:0,offset:.35},{opacity:.55,offset:.5},{opacity:0}],{duration:850});
}
W.lub=g=>{if(!muted&&ac&&ac.state==='running')S1(0,g)};                                          // tek vurus (dokunuslar icin)
W.thump=(g=.13,gap=.31)=>{if(muted||!ac||ac.state!=='running')return;const j=1+(Math.random()-.5)*.16;  // lub-dub
  S1(0,g*j);S2(gap+(Math.random()-.5)*.02,g*.8*j);pulse()};
W.tone=(f,d,g,type='sine',at=0)=>{if(!ac||ac.state!=='running')return;const t=ac.currentTime+at,o=ac.createOscillator(),v=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+d);
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.02)};
/* mekanik carkin "tik" sesi: kisa gurultu patlamasi + kucuk govde, her seferinde hafif farkli */
W.tick=()=>{if(!ac||ac.state!=='running')return;const t=ac.currentTime,j=1+(Math.random()-.5)*.25;
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=nb;f.type='bandpass';f.frequency.value=2600*j;f.Q.value=1.4;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.001);g.gain.exponentialRampToValueAtTime(.0001,t+.022);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.3,.04);
  const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(240*j,t);o.frequency.exponentialRampToValueAtTime(110,t+.05);
  og.gain.setValueAtTime(.0001,t);og.gain.linearRampToValueAtTime(.16,t+.002);og.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o.connect(og);og.connect(master);o.start(t);o.stop(t+.08)};
W.blip=()=>W.tone(520+Math.random()*60,.05,.02,'triangle');
W.vib=p=>navigator.vibrate&&navigator.vibrate(p);
function loop(){if(!run)return;lastBeat=performance.now();
  if(ac&&ac.state==='suspended')ac.resume();
  if(!muted&&ac&&ac.state==='running'){W.thump(.13*gm,.31*Math.min(1,.6+.4*mul));W.vib([30,140,20])}
  timer=setTimeout(loop,W.HR_MS()*mul*(1+(Math.random()-.5)*.08))}
W.startHeart=()=>{if(run||!ac||muted)return;run=true;loop()};
W.stopHeart=()=>{run=false;clearTimeout(timer)};
/* kalbin ruh hali: 'fast' hizli+guclu, 'slow' yavas+zayif, 'off' tamamen sessiz (parlama da yok), 'normal' eski haline */
W.heartMood=m=>{clearTimeout(moodT);if(m==='off')applyMood(m);else moodT=setTimeout(()=>applyMood(m),90)};
function applyMood(m){if(m===cur)return;cur=m;
  if(m==='off'){muted=true;W.stopHeart();return}
  const was=muted;muted=false;mul=m==='fast'?.46:m==='slow'?1.9:1;gm=m==='fast'?1.25:m==='slow'?.7:1;
  if(run){clearTimeout(timer);const left=W.HR_MS()*mul-(performance.now()-lastBeat);timer=setTimeout(loop,was?0:Math.max(320,left))}
  else if(W.HEART_AUTO&&ac)W.startHeart()}
W.fadeHeart=(s=2)=>{if(!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);
  master.gain.linearRampToValueAtTime(0,ac.currentTime+s);setTimeout(W.stopHeart,s*1000)};
function unlock(){try{
  if(!ac)init();
  if(ac.state!=='running'){const p=ac.resume();if(p&&p.then)p.then(()=>{if(W.HEART_AUTO)W.startHeart()},()=>{})}
  if(W.HEART_AUTO)W.startHeart()}catch(e){}}
['lub','thump','tone','tick','blip','startHeart','fadeHeart','heartMood'].forEach(k=>{const f=W[k];W[k]=(...a)=>{try{return f(...a)}catch(e){}}});   // ses asla sayfayi bozmasin
['pointerdown','pointerup','touchstart','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state==='suspended')ac.resume().catch(()=>{})});
setTimeout(()=>{try{if(!ac)init()}catch(e){}},0);          // tarayici izin veriyorsa dokunmadan hemen hazir olsun
})();

</script>
<script>
const LS={
  g(k){try{return localStorage.getItem(k)}catch(e){try{return JSON.parse(window.name||'{}')[k]||null}catch(_){return null}}},
  s(k,v){try{localStorage.setItem(k,v)}catch(e){try{const o=JSON.parse(window.name||'{}');o[k]=v;window.name=JSON.stringify(o)}catch(_){}}},
  d(k){try{localStorage.removeItem(k)}catch(e){try{const o=JSON.parse(window.name||'{}');delete o[k];window.name=JSON.stringify(o)}catch(_){}}}};
const FORM='https://formspree.io/f/xqpqzajg', NEXT='step3.html', $=s=>document.querySelector(s);
if(location.search.includes('reset')){['v71','a71','t71'].forEach(k=>LS.d(k))}
{const st=LS.g('v71');if(st==='done')location.replace('regret.html');else if(st==='video')location.replace('step3.html')}
const qs=new URLSearchParams(location.search).get('t');
if(qs)LS.s('t71',qs);
const token=LS.g('t71')||'';
const ans={}, wait=ms=>new Promise(r=>setTimeout(r,ms));
const show=id=>document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id));

async function type(el,txt,sp=62){el.textContent='';for(const c of txt){el.textContent+=c;if(c!==' ')blip();await wait(sp+(',.?'.includes(c)?280:0))}}

/* ---- date wheels ---- */
const D=[...Array(31)].map((_,i)=>i+1),M=['January','February','March','April','May','June','July','August','September','October','November','December'],Y=[...Array(27)].map((_,i)=>2000+i);
function wheel(el,arr){
  arr.forEach(v=>{const d=document.createElement('div');d.textContent=v;el.appendChild(d)});
  const items=[...el.children],H=38,STEP=27*Math.PI/180,R=H/STEP;      // tambur yaricapi: komsu satir 27 derece
  let last=-1,raf=0;
  const paint=()=>{raf=0;const c=el.scrollTop/H;
    for(let j=0;j<items.length;j++){const it=items[j],off=j-c,a=Math.abs(off);
      if(a>3.4){it.style.visibility='hidden';continue}
      it.style.visibility='';
      const th=Math.max(-1.35,Math.min(1.35,off*STEP));                  // radyan
      const dy=R*Math.sin(th)-off*H;                                     // silindir yuzeyine oturt
      it.style.transform=`translateY(${dy.toFixed(2)}px) perspective(420px) rotateX(${(-th*180/Math.PI).toFixed(2)}deg) scale(${(1+.08*Math.max(0,1-a)).toFixed(3)})`;
      it.style.opacity=Math.max(.06,Math.cos(th)**2.2*(a<.5?1:.78)).toFixed(3);
      it.style.color=a<.5?'#fff':'#8a8a8a'}
  };
  const sel=()=>{const i=Math.min(arr.length-1,Math.max(0,Math.round(el.scrollTop/H)));
    if(i!==last){if(last>=0){tick();vib(6)}last=i}
    el.dataset.i=i;if(!raf)raf=requestAnimationFrame(paint)};
  el.addEventListener('scroll',sel,{passive:true});

  /* mouse ile surukleme + atalet (dokunmatikte tarayicinin kendi momentumu kullanilir) */
  let down=false,y0=0,s0=0,vy=0,ly=0,lt=0,anim=0;
  const stop=()=>{cancelAnimationFrame(anim)};
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;stop();down=true;y0=ly=e.clientY;s0=el.scrollTop;lt=performance.now();vy=0;
    el.style.scrollSnapType='none';el.classList.add('drag');el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!down)return;const now=performance.now();el.scrollTop=s0-(e.clientY-y0);
    const dt=Math.max(1,now-lt);vy=.8*vy+.2*((e.clientY-ly)/dt*16);ly=e.clientY;lt=now});
  const release=()=>{if(!down)return;down=false;el.classList.remove('drag');
    let v=-vy;                                                              // px / kare
    const glide=()=>{if(Math.abs(v)>.35){el.scrollTop+=v;v*=.95;anim=requestAnimationFrame(glide)}
      else{const to=Math.round(el.scrollTop/H)*H;el.scrollTo({top:to,behavior:'smooth'});setTimeout(()=>{el.style.scrollSnapType=''},320)}};
    glide()};
  el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);
  /* mouse tekerlegi: tek tikta tam bir satir, yumusak */
  el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<1)return;e.preventDefault();stop();
    const to=Math.round(el.scrollTop/H+Math.sign(e.deltaY)*(Math.abs(e.deltaY)>40?1:.4))*H;
    el.scrollTo({top:Math.max(0,Math.min((arr.length-1)*H,to)),behavior:'smooth'})},{passive:false});
  sel();paint()}
wheel($('#wd'),D);wheel($('#wm'),M);wheel($('#wy'),Y);

/* ---- words (the ones from the first page + a few it never showed) ---- */
const WORDS=['extravaganza','why?','forbear','you are fake','uncertainty','endure','resist','quality','regretful'].sort(()=>Math.random()-.5);
WORDS.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w;b.style.setProperty('--d',(i*-.7)+'s');b.onclick=()=>pickWord(b,w);$('#words').appendChild(b)});

/* ---- letters: U first, REGRET in row 2, WHY starts row 4 ---- */
'UATNOSKDUMPCREGRETFLBJVZQIAWHY'.split('').forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.style.setProperty('--i',i);
  b.onclick=()=>pickLetter(b,c);b.addEventListener('pointerenter',ev=>{if(ev.pointerType==='mouse')heartMood(c==='U'?'fast':'slow')});$('#keys').appendChild(b)});
$('#keys').addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')heartMood('normal')});

async function begin(){
  show('st');await wait(3200);show('');await wait(1300);
  if(LS.g('a71'))return count();
  show('s1');await wait(900);await type($('#q1'),'Which of the dates mattered most to you?');$('#f1').classList.add('on')}
begin();

$('#n1').onclick=async()=>{
  ans.date=`${D[$('#wd').dataset.i]}.${+$('#wm').dataset.i+1}.${Y[$('#wy').dataset.i]}`;
  show('s2');await wait(1200);await type($('#q2'),'Which of the words on that page haven\u2019t you seen yet?');$('#f2').classList.add('on')};

async function pickWord(b,w){if(ans.word)return;ans.word=w;$('#words').classList.add('pick');b.classList.add('s');await wait(2200);
  show('s3');await wait(1200);await type($('#q3'),'Which letter feels closer to you?');$('#f3').classList.add('on')}

let pend=null;
function pickLetter(b,c){if(ans.letter)return;pend=c;heartMood(c==='U'?'fast':'off');$('#ch').textContent=c;$('#f3').style.display='none';const k=$('#ask');k.style.display='block';requestAnimationFrame(()=>requestAnimationFrame(()=>k.classList.add('on')))}
$('#no').onclick=()=>{heartMood('normal');const k=$('#ask');k.classList.remove('on');k.style.display='none';$('#f3').style.display='';pend=null};
$('#yes').onclick=async()=>{if(!pend||ans.letter)return;ans.letter=pend;heartMood('normal');$('#ask').classList.remove('on');
  LS.s('a71',JSON.stringify(ans));
  const fd=new FormData();fd.append('step','2');fd.append('token',token);fd.append('date',ans.date);fd.append('word',ans.word);fd.append('letter',ans.letter);
  try{await fetch(FORM,{method:'POST',body:fd,headers:{Accept:'application/json'}})}catch(e){}
  await wait(1800);count()};

/* ---- 71 ---- */
let n=71,armed=false;
HEART_AUTO=true;HR_MS=()=>Math.max(640,1050-(71-n)*6);   // geri sayimda kalp yavas yavas hizlanir
async function count(){show('s4');await wait(1500);armed=true;setTimeout(()=>$('#hint').classList.add('on'),2500)}
function hit(e){if(!armed||n<=1)return;n--;$('#big').textContent=n;$('#hint').style.opacity=0;vib(25);$('#big').animate([{opacity:.45,filter:'blur(4px)'},{opacity:1,filter:'blur(0)'}],{duration:240});
  if(e&&e.clientX!=null){const r=document.createElement('div');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),1100)}
  if(n>1&&n<=14){const t=(14-n)/13;$('#big').style.color=`rgb(255,${Math.round(255-t*200)},${Math.round(255-t*200)})`}
  if(n===1){armed=false;stopHeart();$('#big').style.color='';document.body.animate([{transform:'translate(0,0)'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-4px)'},{transform:'translate(-3px,2px)'},{transform:'translate(0,0)'}],{duration:450});thump(.35);vib([80,60,120]);$('#big').classList.add('red');setTimeout(()=>$('#bk').classList.add('on'),5500);setTimeout(()=>location.replace(NEXT),12000)}}
document.addEventListener('pointerdown',e=>{if($('#s4').classList.contains('on'))hit(e)});
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')hit()});
</script><script>
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const c=document.getElementById('dust'),x=c.getContext('2d');let W,H;const P=[];
const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
const N=Math.min(36,Math.floor(innerWidth/22));
for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,v:Math.random()*.22+.05,a:Math.random()*.35+.1,s:Math.random()*6.28});
(function f(t){if(document.hidden){requestAnimationFrame(f);return}x.clearRect(0,0,W,H);x.fillStyle='#fff';
 for(const p of P){p.y-=p.v;p.x+=Math.sin(t/3200+p.s)*.15;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
  x.globalAlpha=p.a*(.55+.45*Math.sin(t/1300+p.s));x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
 requestAnimationFrame(f)})(0)})();
</script>
</body></html>
