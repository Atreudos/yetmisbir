<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>71</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif;touch-action:manipulation;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85))}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s,visibility 1s}
.scene.on{opacity:1;visibility:visible}
.q{font-size:clamp(18px,4.8vw,24px);line-height:1.45;min-height:3.4em;max-width:520px;margin:0 0 24px}
.stage{font-size:clamp(26px,8vw,44px);letter-spacing:.4em;padding-left:.4em;font-weight:400}
.scene.on .stage{animation:stg 3.4s var(--e,cubic-bezier(.2,.7,.2,1)) both}
@keyframes stg{from{letter-spacing:1.1em;filter:blur(8px)} to{letter-spacing:.4em;filter:blur(0)}}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
::selection{background:#fff;color:#000}
.fade{opacity:0;transition:opacity 1.6s}.fade.on{opacity:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nx{margin-top:26px;font-size:16px;color:#aaa;letter-spacing:.08em;padding:10px 18px}
.nx:hover{color:#fff}
/* date wheels */
.wheels{display:flex;gap:6px;justify-content:center;height:152px;position:relative}
.wheels::before{content:"";position:absolute;left:0;right:0;top:57px;height:38px;border-top:1px solid #444;border-bottom:1px solid #444;pointer-events:none}
.wh{width:78px;height:152px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:57px 0;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wh.m{width:124px}.wh::-webkit-scrollbar{display:none}
.wh div{height:38px;line-height:38px;scroll-snap-align:center;font-size:20px;color:#555;transition:color .15s}
.wh div.a{color:#fff}
/* words */
.words{display:flex;flex-wrap:wrap;gap:16px 26px;justify-content:center;max-width:460px}
.words button{font-size:19px;color:#aaa;animation:fl 6s ease-in-out var(--d) infinite alternate;transition:opacity 1s,color .6s,filter 1s}
.words.pick button{opacity:.08;filter:blur(3px)}.words.pick button.s{opacity:1;color:#fff;filter:none}
@keyframes fl{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
/* keys */
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:min(86vw,360px)}
.keys button{aspect-ratio:1;border:1px solid #2c2c2c;border-radius:4px;color:#555;font-size:22px;opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1s,color .4s,border-color .4s;transition-delay:calc(var(--i)*35ms)}
.fade.on .keys button{opacity:1;transform:none}
.keys button:hover{border-color:#777;color:#bbb}.keys button:active{transform:scale(.9);transition-delay:0s}
.fade:not(.on){pointer-events:none}
.ask{text-align:center}.ask .ch{font-size:64px;margin-bottom:6px}.ask p{font-size:20px;margin:0 0 22px}
.ask button{font-size:18px;color:#aaa;letter-spacing:.08em;padding:10px 26px}.ask button:hover{color:#fff}
.keys.pick button{opacity:.06}.keys.pick button.s{opacity:1;color:#fff}
/* countdown */
.rip{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border:1px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none;z-index:45;animation:rip 1.1s ease-out forwards}@keyframes rip{to{transform:scale(14);opacity:0}}
@keyframes pop{from{transform:scale(.55);filter:blur(8px);opacity:0}to{transform:none;filter:none;opacity:1}}
.ask.on .ch{animation:pop .9s cubic-bezier(.2,.7,.2,1)}
.big{font-size:min(34vw,180px);transition:color 2.5s,transform 8s ease-in;user-select:none}
.big.red{color:#c40000;transform:scale(2.6)}
.hint{position:fixed;bottom:9vh;font-size:13px;color:#888;letter-spacing:.1em}
#bk{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 3.5s;z-index:60;pointer-events:none}#bk.on{opacity:1}
@media(prefers-reduced-motion:reduce){.words button{animation:none}}
</style></head><body>
<canvas id="dust" aria-hidden="true"></canvas>

<section class="scene" id="st"><div class="stage">STAGE 2</div></section>

<section class="scene" id="s1"><p class="q" id="q1"></p>
  <div class="fade" id="f1"><div class="wheels"><div class="wh" id="wd"></div><div class="wh m" id="wm"></div><div class="wh" id="wy"></div></div>
  <button class="nx" id="n1">next</button></div></section>

<section class="scene" id="s2"><p class="q" id="q2"></p>
  <div class="fade" id="f2"><div class="words" id="words"></div></div></section>

<section class="scene" id="s3"><p class="q" id="q3"></p>
  <div class="fade" id="f3"><div class="keys" id="keys"></div></div>
  <div class="ask fade" id="ask" style="display:none"><div class="ch" id="ch"></div><p>are you sure?</p><button id="yes">yes</button><button id="no">no</button></div></section>

<section class="scene" id="s4"><div class="big" id="big">71</div><div class="hint fade" id="hint">tap</div></section>
<div id="bk"></div>

<script>
/* Kalp atisi motoru: step2 ve step3 ortak kullanir. Ses kodla uretilir, dosya yok. */
(()=>{
const W=window;let ac,bus,master,nb,timer,run=false,pu;
W.HR_MS=()=>1000; W.HEART_AUTO=false;
function init(){
  ac=new (W.AudioContext||W.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.6;master.connect(ac.destination);
  bus=ac.createGain();const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;bus.connect(lp);lp.connect(master);
  const L=Math.floor(ac.sampleRate*.7),ir=ac.createBuffer(2,L,ac.sampleRate);          // kisa oda yankisi
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,2.6)}
  const cv=ac.createConvolver();cv.buffer=ir;const wet=ac.createGain();wet.gain.value=.22;bus.connect(cv);cv.connect(wet);wet.connect(master);
  nb=ac.createBuffer(1,Math.floor(ac.sampleRate*.5),ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
/* tek bir kapakcik sesi: alcalan alcak sinus + filtrelenmis gurultu = "tok" */
function thud(at,f0,f1,dur,g,cut){
  const t=ac.currentTime+at,o=ac.createOscillator(),og=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  og.gain.setValueAtTime(.0001,t);og.gain.linearRampToValueAtTime(g,t+.012);og.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(og);og.connect(bus);o.start(t);o.stop(t+dur+.05);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();
  s.buffer=nb;f.type='lowpass';f.frequency.value=cut;f.Q.value=.7;
  ng.gain.setValueAtTime(.0001,t);ng.gain.linearRampToValueAtTime(g*.9,t+.008);ng.gain.exponentialRampToValueAtTime(.0001,t+dur*.8);
  s.connect(f);f.connect(ng);ng.connect(bus);s.start(t);s.stop(t+dur);
}
function pulse(){                                   // her atista ekranin ortasi cok hafif parlar
  if(!pu){pu=document.createElement('div');pu.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:39;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.1),transparent 62%)';document.body.appendChild(pu)}
  pu.animate([{opacity:0},{opacity:1,offset:.1},{opacity:0,offset:.35},{opacity:.55,offset:.5},{opacity:0}],{duration:850});
}
W.lub=g=>{if(ac)thud(0,72,38,.2,g,230)};                                  // tek vurus (dokunuslar icin)
W.thump=(g=.13)=>{if(!ac)return;const j=1+(Math.random()-.5)*.14;          // lub-dub
  thud(0,72,38,.2,g*j,230);thud(.27+(Math.random()-.5)*.02,96,50,.15,g*.7*j,300);pulse()};
W.tone=(f,d,g,type='sine',at=0)=>{if(!ac)return;const t=ac.currentTime+at,o=ac.createOscillator(),v=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+d);
  v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.02)};
W.tick=()=>W.tone(1500,.03,.025,'triangle');
W.blip=()=>W.tone(520+Math.random()*60,.05,.012,'triangle');
W.vib=p=>navigator.vibrate&&navigator.vibrate(p);
function loop(){if(!run)return;W.thump(.13);W.vib([30,140,20]);timer=setTimeout(loop,W.HR_MS()*(1+(Math.random()-.5)*.08))}
W.startHeart=()=>{if(run||!ac)return;run=true;loop()};
W.stopHeart=()=>{run=false;clearTimeout(timer)};
W.fadeHeart=(s=2)=>{if(!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(master.gain.value,ac.currentTime);
  master.gain.linearRampToValueAtTime(0,ac.currentTime+s);setTimeout(W.stopHeart,s*1000)};
function unlock(){try{if(!ac)init();else if(ac.state==='suspended')ac.resume();if(W.HEART_AUTO)W.startHeart()}catch(e){}}
['lub','thump','tone','tick','blip','startHeart','fadeHeart'].forEach(k=>{const f=W[k];W[k]=(...a)=>{try{return f(...a)}catch(e){}}});   // ses asla sayfayi bozmasin
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
})();

</script>
<script>
const LS={
  g(k){try{return localStorage.getItem(k)}catch(e){try{return JSON.parse(window.name||'{}')[k]||null}catch(_){return null}}},
  s(k,v){try{localStorage.setItem(k,v)}catch(e){try{const o=JSON.parse(window.name||'{}');o[k]=v;window.name=JSON.stringify(o)}catch(_){}}},
  d(k){try{localStorage.removeItem(k)}catch(e){try{const o=JSON.parse(window.name||'{}');delete o[k];window.name=JSON.stringify(o)}catch(_){}}}};
const FORM='https://formspree.io/f/xqpqzajg', NEXT='step3.html', $=s=>document.querySelector(s);
if(location.search.includes('reset')){['v71','a71','t71'].forEach(k=>LS.d(k))}
{const st=LS.g('v71');if(st==='done')location.replace('regret.html');else if(st==='video')location.replace('step3.html')}
const qs=new URLSearchParams(location.search).get('t');
if(qs)LS.s('t71',qs);
const token=LS.g('t71')||'';
const ans={}, wait=ms=>new Promise(r=>setTimeout(r,ms));
const show=id=>document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id));

async function type(el,txt,sp=62){el.textContent='';for(const c of txt){el.textContent+=c;if(c!==' ')blip();await wait(sp+(',.?'.includes(c)?280:0))}}

/* ---- date wheels ---- */
const D=[...Array(31)].map((_,i)=>i+1),M=['January','February','March','April','May','June','July','August','September','October','November','December'],Y=[...Array(27)].map((_,i)=>2000+i);
function wheel(el,arr){arr.forEach(v=>{const d=document.createElement('div');d.textContent=v;el.appendChild(d)});let last=-1;
  const sel=()=>{const i=Math.min(arr.length-1,Math.max(0,Math.round(el.scrollTop/38)));if(i!==last){if(last>=0){tick();vib(8)}last=i;[...el.children].forEach((c,j)=>c.classList.toggle('a',j===i))}el.dataset.i=i};
  el.addEventListener('scroll',sel,{passive:true});sel()}
wheel($('#wd'),D);wheel($('#wm'),M);wheel($('#wy'),Y);

/* ---- words (the ones from the first page + a few it never showed) ---- */
const WORDS=['extravaganza','why?','forbear','you are fake','uncertainty','endure','resist','quality','regretful'].sort(()=>Math.random()-.5);
WORDS.forEach((w,i)=>{const b=document.createElement('button');b.textContent=w;b.style.setProperty('--d',(i*-.7)+'s');b.onclick=()=>pickWord(b,w);$('#words').appendChild(b)});

/* ---- letters: U first, REGRET in row 2, WHY starts row 4 ---- */
'UATNOSKDUMPCREGRETFLBJVZQIAWHY'.split('').forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.style.setProperty('--i',i);
  b.onclick=()=>pickLetter(b,c);$('#keys').appendChild(b)});

async function begin(){
  show('st');await wait(3200);show('');await wait(1300);
  if(LS.g('a71'))return count();
  show('s1');await wait(900);await type($('#q1'),'Which of the dates mattered most to you?');$('#f1').classList.add('on')}
begin();

$('#n1').onclick=async()=>{
  ans.date=`${D[$('#wd').dataset.i]}.${+$('#wm').dataset.i+1}.${Y[$('#wy').dataset.i]}`;
  show('s2');await wait(1200);await type($('#q2'),'Which of the words on that page haven\u2019t you seen yet?');$('#f2').classList.add('on')};

async function pickWord(b,w){if(ans.word)return;ans.word=w;thump(.12);$('#words').classList.add('pick');b.classList.add('s');await wait(2200);
  show('s3');await wait(1200);await type($('#q3'),'Which letter feels closer to you?');$('#f3').classList.add('on')}

let pend=null;
function pickLetter(b,c){if(ans.letter)return;pend=c;$('#ch').textContent=c;$('#f3').style.display='none';const k=$('#ask');k.style.display='block';requestAnimationFrame(()=>requestAnimationFrame(()=>k.classList.add('on')))}
$('#no').onclick=()=>{const k=$('#ask');k.classList.remove('on');k.style.display='none';$('#f3').style.display='';pend=null};
$('#yes').onclick=async()=>{if(!pend||ans.letter)return;ans.letter=pend;thump(.12);$('#ask').classList.remove('on');
  LS.s('a71',JSON.stringify(ans));
  const fd=new FormData();fd.append('step','2');fd.append('token',token);fd.append('date',ans.date);fd.append('word',ans.word);fd.append('letter',ans.letter);
  try{await fetch(FORM,{method:'POST',body:fd,headers:{Accept:'application/json'}})}catch(e){}
  await wait(1800);count()};

/* ---- 71 ---- */
let n=71,armed=false;
HEART_AUTO=true;HR_MS=()=>Math.max(640,1050-(71-n)*6);   // geri sayimda kalp yavas yavas hizlanir
async function count(){show('s4');await wait(1500);armed=true;setTimeout(()=>$('#hint').classList.add('on'),2500)}
function hit(e){if(!armed||n<=1)return;n--;$('#big').textContent=n;$('#hint').style.opacity=0;lub(.2);vib(25);$('#big').animate([{opacity:.45,filter:'blur(4px)'},{opacity:1,filter:'blur(0)'}],{duration:240});
  if(e&&e.clientX!=null){const r=document.createElement('div');r.className='rip';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),1100)}
  if(n>1&&n<=14){const t=(14-n)/13;$('#big').style.color=`rgb(255,${Math.round(255-t*200)},${Math.round(255-t*200)})`}
  if(n===1){armed=false;stopHeart();$('#big').style.color='';document.body.animate([{transform:'translate(0,0)'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-4px)'},{transform:'translate(-3px,2px)'},{transform:'translate(0,0)'}],{duration:450});thump(.35);vib([80,60,120]);$('#big').classList.add('red');setTimeout(()=>$('#bk').classList.add('on'),5500);setTimeout(()=>location.replace(NEXT),12000)}}
document.addEventListener('pointerdown',e=>{if($('#s4').classList.contains('on'))hit(e)});
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')hit()});
</script><script>
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const c=document.getElementById('dust'),x=c.getContext('2d');let W,H;const P=[];
const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
const N=Math.min(55,Math.floor(innerWidth/16));
for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,v:Math.random()*.22+.05,a:Math.random()*.35+.1,s:Math.random()*6.28});
(function f(t){x.clearRect(0,0,W,H);x.fillStyle='#fff';
 for(const p of P){p.y-=p.v;p.x+=Math.sin(t/3200+p.s)*.15;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
  x.globalAlpha=p.a*(.55+.45*Math.sin(t/1300+p.s));x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
 requestAnimationFrame(f)})(0)})();
</script>
</body></html>
